name: Executar Estacao Meteorologica

on:
  workflow_dispatch: # Permite disparar manualmente pelo botão no GitHub
  schedule:
    - cron: '*/30 * * * *' # Executa automaticamente a cada 30 minutos

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Executar o script da Estacao Meteorologica
        env:
          THINGSPEAK_API_KEY: ${{ secrets.THINGSPEAK_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          python clima_thingspeak.py
