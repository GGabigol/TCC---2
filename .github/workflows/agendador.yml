name: Executar Estacao Meteorologica

on:
  workflow_dispatch: # Permite disparar manualmente pelo botão no GitHub
  schedule:
    - cron: '*/20 * * * *' # Tenta rodar automaticamente a cada 20 minutos

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar o script da Estacao Meteorologica
        env:
          THINGSPEAK_KEY: ${{ secrets.THINGSPEAK_KEY }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
        run: |
          python clima_thingspeak.py
